<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="StartIn">
  <title>StartIn</title>
  <!-- Navy tile -->
  <rect width="64" height="64" rx="15" fill="#0f2850"/>
  <!-- Three rising milestones: idea, product, growth -->
  <rect x="11" y="40" width="9" height="12" rx="2.5" fill="#ffffff" opacity="0.45"/>
  <rect x="24" y="33" width="9" height="19" rx="2.5" fill="#ffffff" opacity="0.7"/>
  <rect x="37" y="26" width="9" height="26" rx="2.5" fill="#ffffff"/>
  <!-- Launch trail -->
  <path d="M9 35 C 19 33, 29 28, 38.5 21.5" fill="none" stroke="#f26b1d" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Rocket riding the trail, pointing up and to the right -->
  <g transform="translate(46 15) rotate(45)">
    <path d="M0 -12 C 4.6 -8 5.6 -2.5 5.4 4 L -5.4 4 C -5.6 -2.5 -4.6 -8 0 -12 Z" fill="#f26b1d"/>
    <path d="M-5.2 0.5 L-9.5 7 L-5 5.6 Z M5.2 0.5 L9.5 7 L5 5.6 Z" fill="#f26b1d"/>
    <circle cx="0" cy="-3.5" r="2.3" fill="#0f2850"/>
  </g>
</svg>
