<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StartIn intro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #050d1f; overflow: hidden; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #stage { position: fixed; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; pointer-events: none; }
  .name { position: absolute; top: 380px; width: 100%; text-align: center; font: 800 160px/1 Poppins, sans-serif; letter-spacing: -3px; }
  #title { color: #fff; }
  #title span { display: inline-block; opacity: 0; text-shadow: 0 0 30px rgba(47, 211, 255, .5); }
  #title span.in { color: #f26b1d; text-shadow: 0 0 32px rgba(242, 107, 29, .6); }
  #shine { background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%); background-size: 260% 100%; background-position: 130% 0;
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #sub { position: absolute; top: 580px; width: 100%; text-align: center; font: 600 31px/1 Poppins, sans-serif; letter-spacing: .34em; text-indent: .34em;
    background: linear-gradient(100deg, #8fe6ff 0%, #8fe6ff 42%, #ffffff 50%, #8fe6ff 58%, #8fe6ff 100%); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 12px rgba(47, 211, 255, .35)); clip-path: inset(0 50% 0 50%); }
  #line { position: absolute; top: 640px; left: 480px; width: 640px; height: 3px; border-radius: 3px; opacity: 0;
    background: linear-gradient(90deg, transparent, #2fd3ff 25%, #f26b1d 50%, #2fd3ff 75%, transparent); box-shadow: 0 0 18px #2fd3ff; }
  #cap { position: absolute; top: 800px; width: 100%; text-align: center; font: 500 30px/1.2 Poppins, sans-serif; letter-spacing: .02em; color: #cfefff;
    text-shadow: 0 0 18px rgba(47, 211, 255, .45), 0 2px 10px rgba(5, 13, 31, .9); opacity: 0; }
  #cap b { color: #ffb27d; font-weight: 600; }
  #fade { position: fixed; inset: 0; background: #050d1f; pointer-events: none; }
  #replay { position: fixed; right: 12px; bottom: 12px; font: 500 12px Poppins, sans-serif; color: rgba(255,255,255,.5); background: none; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .embed #replay { display: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage">
  <div id="title" class="name"></div>
  <div id="shine" class="name">StartIn</div>
  <div id="sub">INTELLIGENT STARTUP INCUBATION PLATFORM</div>
  <div id="line"></div>
  <div id="cap"></div>
</div>
<div id="fade"></div>
<button id="replay" type="button">Replay</button>
<script>
/*
 * StartIn intro, about 11.5 s, drawn frame by frame from a single clock so any moment can be rendered with seek(t).
 *  1. The idea      light streams in and fuses into a seed, which falls and lands
 *  2. Incubation    circuit roots spread, a circuit tree grows and leafs
 *  3. Ecosystem     a ring forms; founder, mentor, investor and incubation cell join and exchange pulses
 *  4. The journey   the camera follows a comet up a rising path, stopping at each of the six portal milestones
 *  5. The name
 */
(() => {
  const DUR = 18;
  const embed = new URLSearchParams(location.search).has('embed');
  if (embed) document.documentElement.className = 'embed';
  const $ = (id) => document.getElementById(id);
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeIn = (p) => p * p * p;
  const easeInOut = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const back = (p) => { const c = 1.9; return p <= 0 ? 0 : 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  const R = rng(11);

  const CYAN = '143,243,255', TEAL = '124,245,208', BLUE = '76,201,255', ORANGE = '242,107,29', WHITE = '255,255,255';

  // ---------- geometry helpers: every structure is a polyline that can be drawn partially
  function quad(a, c, b, n = 22) { const pts = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; pts.push([u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]); } return pts; }
  function poly(pts) { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, L, len: L[L.length - 1] }; }
  function pointAt(P, p) {
    const d = P.len * clamp(p); let i = 1; while (i < P.pts.length - 1 && P.L[i] < d) i++;
    const a = P.pts[i - 1], b = P.pts[i], f = (d - P.L[i - 1]) / ((P.L[i] - P.L[i - 1]) || 1);
    return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), Math.atan2(b[1] - a[1], b[0] - a[0])];
  }
  function tracePartial(P, p) {
    if (p <= 0) return false; const d = P.len * clamp(p);
    ctx.beginPath(); ctx.moveTo(...P.pts[0]);
    for (let i = 1; i < P.pts.length; i++) { if (P.L[i] <= d) ctx.lineTo(...P.pts[i]); else { const [x, y] = pointAt(P, p); ctx.lineTo(x, y); break; } }
    return true;
  }
  // glowing stroke: a wide faint pass plus a thin bright core (drawn additively)
  function glow(P, p, rgb, w, a = 1) {
    if (!tracePartial(P, p)) return;
    ctx.strokeStyle = `rgba(${rgb},${.18 * a})`; ctx.lineWidth = w * 4; ctx.stroke();
    ctx.strokeStyle = `rgba(${rgb},${a})`; ctx.lineWidth = w; ctx.stroke();
  }
  function dot(x, y, r, rgb, a = 1) {
    if (r <= 0 || a <= 0) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2); g.addColorStop(0, `rgba(${rgb},${a * .55})`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(${WHITE},${a})`; ctx.beginPath(); ctx.arc(x, y, r * .55, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(${rgb},${a})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.globalAlpha = .6; ctx.fill(); ctx.globalAlpha = 1;
  }
  function star4(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x, y, x + s, y); ctx.quadraticCurveTo(x, y, x, y + s); ctx.quadraticCurveTo(x, y, x - s, y); ctx.quadraticCurveTo(x, y, x, y - s); ctx.fill(); }
  function leaf(x, y, ang, s, a) {
    if (s <= 0) return;
    ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(8, -12, 26, -12, 34, 0); ctx.bezierCurveTo(26, 12, 8, 12, 0, 0);
    ctx.fillStyle = `rgba(${ORANGE},${.25 * a})`; ctx.shadowColor = `rgba(${ORANGE},${a})`; ctx.shadowBlur = 18; ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255,138,61,${a})`; ctx.fill();
    ctx.strokeStyle = `rgba(255,220,190,${.7 * a})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(30, 0); ctx.stroke();
    ctx.restore();
  }

  // ---------- scene layout (world coordinates)
  const GROUND = 560, SEED = [800, GROUND], HEART = [800, 400];
  const roots = [
    [[800, 560], [800, 598], [762, 628], [700, 628], [676, 652]],
    [[800, 560], [822, 592], [872, 612], [924, 612], [944, 640]],
    [[800, 560], [792, 612], [792, 668]],
    [[800, 572], [742, 590], [628, 590]],
    [[800, 572], [858, 584], [972, 584]],
  ].map(poly);
  const trunk = poly(quad([800, 560], [810, 440], [800, 300]));
  const branches = [
    { P: poly(quad([800, 470], [740, 440], [688, 352])), at: .2 },
    { P: poly(quad([800, 445], [866, 420], [912, 338])), at: .3 },
    { P: poly(quad([800, 385], [756, 340], [736, 262])), at: .5 },
    { P: poly(quad([800, 362], [850, 320], [868, 250])), at: .6 },
    { P: poly(quad([800, 300], [796, 260], [800, 214])), at: .85 },
  ];
  const twigs = [
    [[803, 520], [770, 508], [770, 486]], [[805, 500], [836, 488], [836, 466]],
    [[802, 420], [772, 410], [772, 392]], [[802, 400], [830, 390], [830, 372]],
  ].map(poly);
  const RING_R = 300;
  const roles = [
    { name: 'Founder', deg: -150, draw: drawFounder }, { name: 'Mentor', deg: -30, draw: drawMentor },
    { name: 'Investor', deg: 30, draw: drawInvestor }, { name: 'Incubation Cell', deg: 150, draw: drawCell },
  ].map((r) => ({ ...r, x: HEART[0] + Math.cos(r.deg * Math.PI / 180) * RING_R, y: HEART[1] + Math.sin(r.deg * Math.PI / 180) * RING_R }));
  // a smooth rising curve (Catmull-Rom through the control points), one milestone at each inner point
  function catmull(pts, n = 26) {
    const out = [pts[0]], idx = [0];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      for (let k = 1; k <= n; k++) {
        const t = k / n, t2 = t * t, t3 = t2 * t;
        out.push([0, 1].map((d) => .5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3)));
      }
      idx.push(out.length - 1);
    }
    return { pts: out, idx };
  }
  const JC = catmull([[160, 800], [380, 690], [560, 722], [760, 560], [945, 600], [1120, 402], [1300, 262], [1470, 110]]);
  const J = poly(JC.pts);
  const STEPS = [
    ['Register', 'Create your account'], ['Submit idea', 'Problem, solution & team'], ['Verified', 'Approved by the Cell'],
    ['Mentored', 'Guided from idea to revenue'], ['Funded', 'An investor deal is secured'], ['Incubated', 'Officially incubated'],
  ];
  const stepAt = STEPS.map((_, i) => J.L[JC.idx[i + 1]] / J.len);
  // the traveller eases into each milestone and pauses there before moving on
  const JS = 7.7, TRAVEL = .58, DWELL = .27, legs = [], arrive = [];
  { const fr = [0, ...stepAt, 1]; let tt = JS; for (let i = 0; i < 7; i++) { legs.push([tt, tt + TRAVEL, fr[i], fr[i + 1]]); tt += TRAVEL; if (i < 6) { arrive.push(tt); tt += DWELL; } } }
  const JEND = legs[legs.length - 1][1];
  function jProg(t) { if (t <= JS) return 0; for (const [a, b, fa, fb] of legs) { if (t < a) return fa; if (t < b) return lerp(fa, fb, easeInOut(seg(t, a, b))); } return 1; }
  const miniBursts = STEPS.map(() => Array.from({ length: 16 }, () => ({ a: R() * Math.PI * 2, d: 50 + R() * 70, r: 1 + R() * 1.6 })));

  // ---------- role icons (centred on 0,0; ~36px across)
  function iconStroke(rgb, a) { ctx.strokeStyle = `rgba(${rgb},${a})`; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
  function person(a, rgb) { iconStroke(rgb, a); ctx.beginPath(); ctx.arc(0, -6, 8, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-16, 20); ctx.quadraticCurveTo(-15, 5, 0, 5); ctx.quadraticCurveTo(15, 5, 16, 20); ctx.stroke(); }
  function drawFounder(a) { person(a, CYAN); ctx.fillStyle = `rgba(${ORANGE},${a})`; star4(15, -19, 7); }
  function drawMentor(a) {
    person(a, CYAN); iconStroke(ORANGE, a);
    ctx.beginPath(); ctx.moveTo(-15, -17); ctx.lineTo(0, -24); ctx.lineTo(15, -17); ctx.lineTo(0, -10); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(15, -17); ctx.lineTo(15, -8); ctx.stroke();
  }
  function drawInvestor(a) {
    iconStroke(CYAN, a);
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(-6, 14 - i * 9, 12, 4.5, 0, 0, 7); ctx.stroke(); }
    iconStroke(ORANGE, a); ctx.beginPath(); ctx.moveTo(8, 8); ctx.lineTo(15, -4); ctx.lineTo(20, 2); ctx.lineTo(24, -16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, -16); ctx.lineTo(24, -16); ctx.lineTo(24, -10); ctx.stroke();
  }
  function drawCell(a) {
    iconStroke(CYAN, a);
    ctx.beginPath(); ctx.moveTo(-20, -8); ctx.lineTo(0, -21); ctx.lineTo(20, -8); ctx.closePath(); ctx.stroke();
    [-12, 0, 12].forEach((x) => { ctx.beginPath(); ctx.moveTo(x, -3); ctx.lineTo(x, 14); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(-21, 20); ctx.lineTo(21, 20); ctx.stroke();
    ctx.fillStyle = `rgba(${ORANGE},${a})`; ctx.beginPath(); ctx.arc(0, -11, 3, 0, 7); ctx.fill();
  }

  // ---------- milestone icons (centred on 0,0)
  const STEP_ICONS = [
    (a) => { ctx.save(); ctx.translate(-4, 0); ctx.scale(.72, .72); person(a, CYAN); ctx.restore(); iconStroke(ORANGE, a); ctx.beginPath(); ctx.moveTo(13, -14); ctx.lineTo(13, -4); ctx.moveTo(8, -9); ctx.lineTo(18, -9); ctx.stroke(); },
    (a) => { iconStroke(CYAN, a); ctx.beginPath(); ctx.moveTo(-11, -15); ctx.lineTo(5, -15); ctx.lineTo(11, -9); ctx.lineTo(11, 15); ctx.lineTo(-11, 15); ctx.closePath(); ctx.stroke();
      ctx.lineWidth = 2.4; [-4, 2, 8].forEach((y) => { ctx.beginPath(); ctx.moveTo(-6, y); ctx.lineTo(6, y); ctx.stroke(); }); ctx.fillStyle = `rgba(${ORANGE},${a})`; star4(12, -15, 6); },
    (a) => { iconStroke(CYAN, a); ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(13, -11); ctx.lineTo(13, 0); ctx.quadraticCurveTo(12, 11, 0, 17); ctx.quadraticCurveTo(-12, 11, -13, 0); ctx.lineTo(-13, -11); ctx.closePath(); ctx.stroke();
      iconStroke(ORANGE, a); ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-1, 5); ctx.lineTo(7, -5); ctx.stroke(); },
    (a) => { ctx.save(); ctx.scale(.78, .78); drawMentor(a); ctx.restore(); },
    (a) => { ctx.save(); ctx.scale(.8, .8); drawInvestor(a); ctx.restore(); },
    (a) => { iconStroke(CYAN, a); ctx.save(); ctx.rotate(Math.PI / 4);
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.quadraticCurveTo(9, -9, 7, 8); ctx.lineTo(-7, 8); ctx.quadraticCurveTo(-9, -9, 0, -18); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -5, 3, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-7, 2); ctx.lineTo(-12, 11); ctx.lineTo(-7, 9); ctx.moveTo(7, 2); ctx.lineTo(12, 11); ctx.lineTo(7, 9); ctx.stroke();
      iconStroke(ORANGE, a); ctx.beginPath(); ctx.moveTo(-3, 12); ctx.lineTo(0, 19); ctx.lineTo(3, 12); ctx.stroke(); ctx.restore(); },
  ];

  // ---------- particles (deterministic)
  const dust = Array.from({ length: 180 }, () => ({ x: R(), y: R(), r: .4 + R() * 1.6, vx: (R() - .5) * .006, vy: -.002 - R() * .01, w: 1 + R() * 3, ph: R() * 6.3, c: R() < .12 ? ORANGE : (R() < .5 ? CYAN : WHITE) }));
  const conv = Array.from({ length: 120 }, () => ({ a: R() * Math.PI * 2, d: 420 + R() * 700, dl: R() * .5, c: R() < .25 ? ORANGE : CYAN }));
  const burst = Array.from({ length: 110 }, () => ({ a: R() * Math.PI * 2, s: 90 + R() * 420, r: .8 + R() * 2.4, c: R() < .35 ? ORANGE : CYAN }));
  const flies = Array.from({ length: 26 }, () => ({ a: R() * 6.3, r: 90 + R() * 190, w: (.15 + R() * .3) * (R() < .5 ? -1 : 1), ph: R() * 6.3, c: R() < .3 ? ORANGE : (R() < .5 ? TEAL : CYAN) }));
  const sparkles = Array.from({ length: 16 }, () => ({ x: 120 + R() * 1360, y: 80 + R() * 700, s: 6 + R() * 12, ph: R() * 6.3, w: 1.2 + R() * 2 }));
  const nets = [[.06, .2], [.93, .24], [.08, .84], [.92, .82]].map(([cx, cy], k) => { const r2 = rng(100 + k); return Array.from({ length: 7 }, () => ({ x: cx + (r2() - .5) * .16, y: cy + (r2() - .5) * .22, ph: r2() * 6.3 })); });

  // ---------- camera keyframes: [time, centreX, centreY, zoom]
  const CAM = [[0, 800, 390, 1.65], [1.5, 800, 400, 1.35], [2.3, 800, 520, 1.3], [4.6, 800, 420, 1.0], [7.3, 800, 400, .93]];
  function keyCam(t) {
    let i = 1; while (i < CAM.length - 1 && CAM[i][0] < t) i++;
    const a = CAM[i - 1], b = CAM[i], p = easeInOut(seg(t, a[0], b[0]));
    return [lerp(a[1], b[1], p), lerp(a[2], b[2], p), lerp(a[3], b[3], p)];
  }
  function camera(t) {
    let [cx, cy, k] = keyCam(t);
    const [fx, fy] = pointAt(J, jProg(t)), follow = easeInOut(seg(t, 7.3, 8.2)), wide = easeInOut(seg(t, JEND - .1, JEND + 1.0));
    cx = lerp(cx, fx + 110, follow); cy = lerp(cy, fy + 5, follow); k = lerp(k, 1.12, follow);
    cx = lerp(cx, 815, wide); cy = lerp(cy, 455, wide); k = lerp(k, .76, wide) - .03 * easeInOut(seg(t, JEND + 1.0, DUR));
    return [cx, cy, k];
  }

  const cv = $('bg'), ctx = cv.getContext('2d');
  let W = 0, H = 0, S = 1, OX = 0, OY = 0, DPR = 1;
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR;
    S = Math.min(W / 1600, H / 900); OX = (W - 1600 * S) / 2; OY = (H - 900 * S) / 2;
    $('stage').style.transform = `translate(${OX}px, ${OY}px) scale(${S})`;
  }

  function background(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, Math.max(W, H) * .75);
    g.addColorStop(0, '#13336a'); g.addColorStop(.5, '#0a1b38'); g.addColorStop(1, '#040b1a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const gs = 64 * Math.max(S, .5), off = (t * 6) % gs;
    ctx.strokeStyle = 'rgba(120,180,255,0.05)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = -off; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = -off; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    const na = .35 * easeOut(seg(t, .3, 2));
    nets.forEach((pts) => {
      const P = pts.map((p) => [(p.x + Math.sin(t * .4 + p.ph) * .004) * W, (p.y + Math.cos(t * .35 + p.ph) * .004) * H]);
      ctx.strokeStyle = `rgba(120,200,255,${na * .45})`; ctx.beginPath();
      for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) if (Math.hypot(P[i][0] - P[j][0], P[i][1] - P[j][1]) < Math.min(W, H) * .2) { ctx.moveTo(...P[i]); ctx.lineTo(...P[j]); }
      ctx.stroke(); ctx.fillStyle = `rgba(${CYAN},${na})`;
      P.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill(); });
    });
    const da = easeOut(seg(t, 0, 1.5));
    dust.forEach((s) => {
      const x = ((s.x + s.vx * t) % 1 + 1) % 1 * W, y = ((s.y + s.vy * t) % 1 + 1) % 1 * H;
      ctx.fillStyle = `rgba(${s.c},${da * (.25 + .75 * Math.abs(Math.sin(t * s.w + s.ph)))})`; ctx.beginPath(); ctx.arc(x, y, s.r, 0, 7); ctx.fill();
    });
    [[2.8, .78, .06], [6.2, .3, .1], [9.4, .92, .18], [12.6, .55, .04], [15.6, .2, .12]].forEach(([t0, sx, sy]) => {
      const q = seg(t, t0, t0 + .9); if (q <= 0 || q >= 1) return;
      const L = Math.min(W, H) * .5, x = (sx - .32 * easeOut(q)) * W, y = (sy + .3 * easeOut(q)) * H, a = Math.sin(q * Math.PI);
      const g = ctx.createLinearGradient(x, y, x + L * .55, y - L * .5); g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(143,243,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + L * .55, y - L * .5); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();
    });
  }

  function scene(t) {
    const [cx, cy, k] = camera(t);
    ctx.setTransform(DPR * S * k, 0, 0, DPR * S * k, DPR * (OX + S * (800 - cx * k)), DPR * (OY + S * (450 - cy * k)));

  function frame(now) { const t = (now - start) / 1000; render(Math.min(t, DUR)); if (t < DUR) raf = requestAnimationFrame(frame); else finish(); }
  function play() { cancelAnimationFrame(raf); done = false; start = performance.now(); raf = requestAnimationFrame(frame); }
  window.seek = (t) => { cancelAnimationFrame(raf); render(t); };
  $('replay').onclick = play;
  addEventListener('resize', layout);
  layout(); render(0);
  const still = new URLSearchParams(location.search).get('t'); // ?t=5.2 renders a single frame (for reviewing)
  if (still !== null) { document.fonts?.ready.then(() => render(+still)); return; }
  // Wait briefly for the font so labels don't swap mid-animation, but never block on it.
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise((r) => setTimeout(r, 1200))]).then(play);
})();
</script>
